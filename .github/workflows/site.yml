name: Build & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC (08:30 IST)
  workflow_dispatch:

permissions:
  contents: write # commit the weekly data snapshot
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Sync GitHub + LeetCode data
        run: npm run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Scheduled/manual runs commit the refreshed snapshot. Besides keeping a
      # history, the weekly commit keeps the repo "active" so GitHub doesn't
      # disable this cron after 60 quiet days. Pushes made with GITHUB_TOKEN
      # don't trigger another workflow run.
      - name: Commit data snapshot
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- src/data/generated/live.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/live.json
          git commit -m "chore: weekly data sync"
          git push

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
